title: blank
first_name: Youngkyoung
middle_name:
last_name: Kong
contact_note: Feel free to contact me by email.
description: >
  Personal academic website of Youngkyoung Kong, a robotics and control researcher at Seoul National University.
footer_text: >
  Powered by <a href="https://jekyllrb.com/" target="_blank">Jekyll</a> with the
  <a href="https://github.com/alshedivat/al-folio" target="_blank">al-folio</a> theme.
keywords: robotics, control theory, online learning, reinforcement learning, optimization
lang: en
icon: YK

url: https://youngkyoungkong.github.io
baseurl:
last_updated: false
back_to_top: true

al_folio:
  api_version: 1
  style_engine: tailwind
  tailwind:
    version: 4.1.18
    preflight: false
    css_entry: assets/tailwind/app.css
  features:
    cv:
      enabled: false
    distill:
      enabled: false
  compat:
    bootstrap:
      enabled: false
      support_window: v1.0-v1.2
      deprecates_in: v1.3
      removed_in: v2.0
  upgrade:
    channel: stable
    auto_apply_safe_fixes: false

navbar_fixed: true
footer_fixed: false
max_width: 930px
search_enabled: false
socials_in_search: false
posts_in_search: false
bib_search: false

serve_og_meta: true
serve_schema_org: true
og_image:

enable_google_verification: false
google_site_verification:
enable_bing_verification: false
bing_site_verification:

blog_name: Youngkyoung Kong
blog_description:
permalink: /blog/:year/:title/

newsletter:
  enabled: false

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM

include: ["_pages"]
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - vendor
keep_files:
  - .nojekyll

theme: al_folio_core

plugins:
  - jekyll-feed
  - jekyll/scholar
  - jekyll-sitemap
  - jekyll-socials
  - al_folio_core
  - al_icons
  - al_citations

defaults:
  - scope:
      path: "assets"
    values:
      sitemap: false

scholar:
  last_name: [Kong, "Kong*"]
  first_name: [Youngkyoung]
  style: apa
  locale: en
  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib
  bibtex_filters: [latex, smallcaps, superscript]
  replace_strings: true
  join_strings: true
  details_dir: bibliography
  details_link: Details
  query: "@*"
  group_by: year
  group_order: descending

enable_publication_badges:
  altmetric: false
  dimensions: false
  google_scholar: false
  inspirehep: false

filtered_bibtex_keywords:
  - abbr
  - abstract
  - additional_info
  - annotation
  - bibtex_show
  - code
  - html
  - pdf
  - selected
  - slides
  - video
  - website
  - news

max_author_limit: 20
more_authors_animation_delay: 10
enable_publication_thumbnails: true

external_links:
  enabled: true
  rel: external nofollow noopener
  target: _blank
  exclude:

imagemagick:
  enabled: false
lazy_loading_images: true

enable_masonry: false
enable_math: false
enable_tooltips: false
enable_darkmode: true
enable_navbar_social: false
enable_progressbar: false
enable_video_embedding: false
enable_cookie_consent: false
protect_email: false

third_party_libraries:
  fontawesome:
    integrity:
      css: "sha256-MVopmdyC2tYTiJ8wlktf0uh0v4NgT+vNdyVFepi7Q0c="
    url:
      css: "https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.2.0/css/all.min.css"
    version: "7.2.0"
  google_fonts:
    url:
      fonts: "https://fonts.googleapis.com/css?family=Roboto:300,400,500,700|Roboto+Slab:100,300,400,500,700|Material+Icons&display=swap"
  vanilla-back-to-top:
    url:
      js: "https://cdn.jsdelivr.net/npm/vanilla-back-to-top@7.2.1/dist/vanilla-back-to-top.min.js"
